<script>
const state={token:null,profile:null,adminData:null,exam:null,questionIndex:0,timer:null,remaining:0,saveQueue:Promise.resolve()};
const $=id=>document.getElementById(id);
function show(id){['loginView','adminView','studentView','examView'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
function call(fn,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||e)))[fn](...args))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateText(v){if(!v)return '-';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('id-ID')}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();try{const r=await call('apiLogin',$('username').value,$('password').value,$('loginRole').value);state.token=r.token;state.profile=r.profile;if(r.profile.role==='SISWA'){await loadStudent();}else{ $('adminName').textContent=r.profile.nama;$('adminAvatar').textContent=(r.profile.nama||'A').charAt(0).toUpperCase();show('adminView');await adminPage('dashboard');}}catch(err){toast(err.message)}});
$('adminLogout').onclick=logout;$('studentLogout').onclick=logout;
async function logout(){try{await call('apiLogout',state.token)}catch(e){}state.token=null;state.profile=null;state.exam=null;clearInterval(state.timer);show('loginView');$('loginForm').reset()}
$('adminNav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)adminPage(b.dataset.page)});
async function adminPage(page){document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const names={dashboard:'Dashboard',students:'Data Siswa',classes:'Data Kelas',questions:'Bank Soal',packages:'Paket Ujian',schedules:'Jadwal Ujian',results:'Hasil Ujian'};$('pageTitle').textContent=names[page]||'Dashboard';try{state.adminData=await call('apiGetAdminData',state.token);if(page==='dashboard')renderDashboard();if(page==='students')renderStudents();if(page==='classes')renderClasses();if(page==='questions')renderQuestions();if(page==='packages')renderPackages();if(page==='schedules')renderSchedules();if(page==='results')renderResults()}catch(e){toast(e.message)}}
async function renderDashboard(){const d=await call('apiAdminDashboard',state.token);$('adminContent').innerHTML=`<div class="page-head"><div><h3>Ringkasan aktivitas</h3><p>Pantau data peserta dan pelaksanaan ujian sekolah.</p></div><span class="pill">Sistem aktif</span></div><div class="stats">${[['Total Siswa',d.siswa,'♙'],['Bank Soal',d.soal,'✎'],['Paket Ujian',d.paket,'▣'],['Sesi Berlangsung',d.sesiAktif,'◷']].map(x=>`<div class="panel stat"><span class="stat-icon">${x[2]}</span><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><div class="panel table-panel"><h3>Hasil ujian terbaru</h3>${table(['Nama Siswa','Mata Pelajaran','Nilai','Waktu'],d.hasilTerbaru.map(x=>[x.nama,x.mapel,x.nilai,dateText(x.tanggal)]))}</div>`}
function table(headers,rows){if(!rows.length)return '<div class="empty">Belum ada data.</div>';return `<div class="table-wrap"><table class="data-table"><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x??'-'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function pageHead(title,desc,button=''){return `<div class="page-head"><div><h3>${title}</h3><p>${desc}</p></div>${button}</div>`}
function renderStudents(){const d=state.adminData;$('adminContent').innerHTML=pageHead('Data peserta didik','Tambah dan kelola akun siswa kelas 6.')+`<div class="panel form-panel"><h3>Tambah siswa</h3><form id="studentForm" class="form-grid"><div><label>Nama lengkap *</label><input name="nama" required></div><div><label>Username *</label><input name="username" required></div><div><label>NISN</label><input name="nisn"></div><div><label>NIS</label><input name="nis"></div><div><label>Kelas *</label><select name="kelasId" required>${d.kelas.map(k=>`<option value="${esc(k.KelasID)}">${esc(k.NamaKelas)}</option>`).join('')}</select></div><div><label>Jenis kelamin</label><select name="jk"><option value="">Pilih</option><option>L</option><option>P</option></select></div><div><label>Password awal</label><input name="password" placeholder="Kosongkan = Siswa123!"></div><div class="form-actions"><button class="btn primary">Simpan siswa</button></div></form></div><div class="panel table-panel"><h3>Daftar siswa (${d.siswa.length})</h3>${table(['Nama','NISN','Kelas','Username','Status'],d.siswa.map(s=>[esc(s.NamaSiswa),esc(s.NISN),esc((d.kelas.find(k=>k.KelasID===s.KelasID)||{}).NamaKelas||'-'),esc(s.Username),`<span class="pill">${esc(s.Status)}</span>`]))}</div>`;$('studentForm').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));try{const r=await call('apiSaveStudent',state.token,x);toast('Siswa tersimpan. '+(r.defaultPassword?'Password awal: '+r.defaultPassword:''));adminPage('students')}catch(err){toast(err.message)}}}
function renderClasses(){const d=state.adminData;$('adminContent').innerHTML=pageHead('Data kelas','Buat rombongan belajar peserta.')+`<div class="panel form-panel"><h3>Tambah kelas</h3><form id="classForm" class="form-grid"><div><label>Nama kelas *</label><input name="nama" placeholder="Contoh: VI-A" required></div><div><label>Tahun ajaran</label><input name="tahun" value="2026/2027"></div><div><label>Wali kelas</label><input name="wali"></div><div class="form-actions"><button class="btn primary">Simpan kelas</button></div></form></div><div class="panel table-panel"><h3>Daftar kelas</h3>${table(['Nama Kelas','Tahun Ajaran','Wali Kelas','Status'],d.kelas.map(k=>[esc(k.NamaKelas),esc(k.TahunAjaran),esc(k.WaliKelas),esc(k.Status)]))}</div>`;$('classForm').onsubmit=async e=>{e.preventDefault();try{await call('apiSaveClass',state.token,Object.fromEntries(new FormData(e.target)));toast('Kelas tersimpan');adminPage('classes')}catch(err){toast(err.message)}}}
function renderQuestions(){const d=state.adminData;$('adminContent').innerHTML=pageHead('Bank soal','Buat soal pilihan ganda Bahasa Indonesia dan Matematika.')+`<div class="panel form-panel"><h3>Tambah soal pilihan ganda</h3><form id="questionForm" class="form-grid"><div><label>Mata pelajaran *</label><select name="mapel"><option>Bahasa Indonesia</option><option>Matematika</option></select></div><div><label>Materi</label><input name="materi"></div><div class="wide"><label>Pertanyaan *</label><textarea name="pertanyaan" rows="3" required></textarea></div>${['A','B','C','D'].map((x,i)=>`<div><label>Opsi ${x}</label><input name="opsi${x}" required></div>`).join('')}<div><label>Kunci jawaban</label><select name="benar"><option>A</option><option>B</option><option>C</option><option>D</option></select></div><div><label>Tingkat kesulitan</label><select name="level"><option>Mudah</option><option selected>Sedang</option><option>Sulit</option></select></div><div class="wide"><label>Pembahasan (opsional)</label><textarea name="pembahasan" rows="2"></textarea></div><div class="form-actions"><button class="btn primary">Simpan soal</button></div></form></div><div class="panel table-panel"><h3>Daftar soal (${d.soal.length})</h3>${table(['Mata Pelajaran','Materi','Pertanyaan','Status'],d.soal.map(q=>[esc(q.MataPelajaran),esc(q.Materi),esc(q.Pertanyaan),esc(q.Status)]))}</div>`;$('questionForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const x={mapel:f.get('mapel'),materi:f.get('materi'),pertanyaan:f.get('pertanyaan'),level:f.get('level'),pembahasan:f.get('pembahasan'),opsi:['A','B','C','D'].map(k=>({teks:f.get('opsi'+k),benar:f.get('benar')===k}))};try{await call('apiSaveQuestion',state.token,x);toast('Soal berhasil disimpan');adminPage('questions')}catch(err){toast(err.message)}}}
function renderPackages(){const d=state.adminData;$('adminContent').innerHTML=pageHead('Paket ujian','Kelompokkan soal menjadi latihan atau simulasi TKA.')+`<div class="panel form-panel"><h3>Buat paket</h3><form id="packageForm" class="form-grid"><div><label>Nama paket *</label><input name="nama" required></div><div><label>Jenis</label><select name="jenis"><option value="LATIHAN">Latihan</option><option value="SIMULASI">Simulasi ujian</option></select></div><div><label>Mata pelajaran *</label><select name="mapel"><option>Bahasa Indonesia</option><option>Matematika</option></select></div><div><label>Durasi (menit)</label><input name="durasi" type="number" min="1" value="60"></div><div><label>Jumlah soal (0 = semua)</label><input name="jumlah" type="number" min="0" value="0"></div><div><label>Acak soal</label><select name="acak"><option value="true">Ya</option><option value="">Tidak</option></select></div><div><label>Acak opsi</label><select name="acakOpsi"><option value="true">Ya</option><option value="">Tidak</option></select></div><div><label>Tampilkan hasil ke siswa</label><select name="tampil"><option value="true">Ya</option><option value="">Tidak</option></select></div><div class="wide"><label>Deskripsi</label><textarea name="deskripsi"></textarea></div><div class="form-actions"><button class="btn primary">Simpan paket</button></div></form></div><div class="panel table-panel"><h3>Daftar paket</h3>${table(['Nama Paket','Jenis','Mapel','Durasi','Jumlah Soal','Status'],d.paket.map(p=>[esc(p.NamaPaket),esc(p.JenisPaket),esc(p.MataPelajaran),p.DurasiMenit,p.JumlahSoal,esc(p.Status)]))}</div>`;$('packageForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await call('apiSavePackage',state.token,{nama:f.get('nama'),jenis:f.get('jenis'),mapel:f.get('mapel'),durasi:f.get('durasi'),jumlah:f.get('jumlah'),acak:f.get('acak')==='true',acakOpsi:f.get('acakOpsi')==='true',tampil:f.get('tampil')==='true',deskripsi:f.get('deskripsi')});toast('Paket tersimpan');adminPage('packages')}catch(err){toast(err.message)}}}
function renderSchedules(){const d=state.adminData;$('adminContent').innerHTML=pageHead('Jadwal ujian','Tentukan rentang waktu peserta dapat memulai ujian.')+`<div class="panel form-panel"><h3>Buat jadwal</h3><form id="scheduleForm" class="form-grid"><div><label>Paket ujian *</label><select name="paketId" required>${d.paket.map(p=>`<option value="${esc(p.PaketID)}">${esc(p.NamaPaket)}</option>`).join('')}</select></div><div><label>Nama jadwal *</label><input name="nama" required placeholder="Contoh: Simulasi TKA Gelombang 1"></div><div><label>Mulai *</label><input name="mulai" type="datetime-local" required></div><div><label>Selesai *</label><input name="selesai" type="datetime-local" required></div><div><label>Token (opsional)</label><input name="token"></div><div class="form-actions"><button class="btn primary">Simpan jadwal</button></div></form></div><div class="panel table-panel"><h3>Daftar jadwal</h3>${table(['Nama Jadwal','Paket','Mulai','Selesai','Token','Status'],d.jadwal.map(j=>[esc(j.NamaJadwal),esc((d.paket.find(p=>p.PaketID===j.PaketID)||{}).NamaPaket||'-'),dateText(j.TanggalMulai),dateText(j.TanggalSelesai),esc(j.TokenUjian||'-'),esc(j.Status)]))}</div>`;$('scheduleForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await call('apiSaveSchedule',state.token,Object.fromEntries(f));toast('Jadwal tersimpan');adminPage('schedules')}catch(err){toast(err.message)}}}
function renderResults(){const d=state.adminData;$('adminContent').innerHTML=pageHead('Hasil ujian','Rekap nilai seluruh peserta.')+`<div class="panel table-panel"><h3>Rekap hasil</h3>${table(['Nama Siswa','Mata Pelajaran','Benar','Salah','Kosong','Nilai','Waktu selesai'],d.hasil.map(x=>[esc(x.namaSiswa),esc(x.MataPelajaran),x.JumlahBenar,x.JumlahSalah,x.JumlahKosong,x.Nilai,dateText(x.WaktuSelesai)]))}</div>`}
async function loadStudent(){const d=await call('apiStudentHome',state.token);$('studentName').textContent=d.profile.nama;show('studentView');const results=await call('apiStudentResults',state.token);$('studentContent').innerHTML=`<div class="welcome"><p class="eyebrow" style="color:#d8e4ff">HALO, PESERTA TKA</p><h2>${esc(d.profile.nama)}</h2><p>${esc(d.profile.kelas)} · NISN ${esc(d.profile.nisn||'-')}</p></div><div class="page-head"><div><h3>Ujian tersedia</h3><p>Pilih latihan atau simulasi yang sudah dijadwalkan sekolah.</p></div></div>${d.jadwal.length?d.jadwal.map(j=>`<div class="panel exam-card"><div><span class="pill ${j.status==='SELESAI'?'warn':''}">${esc(j.jenis)}</span><h3>${esc(j.nama)}</h3><p>${esc(j.paket)} · ${esc(j.mapel)} · ${j.durasi} menit</p></div><button class="btn ${j.status==='SELESAI'?'light':'primary'}" ${j.status==='SELESAI'?'disabled':''} onclick="startExam('${j.id}')">${j.status==='SELESAI'?'Sudah selesai':'Mulai ujian'}</button></div>`).join(''):'<div class="panel empty">Belum ada ujian yang tersedia saat ini.</div>'}<div class="panel student-results"><h3>Riwayat hasil ujian</h3>${table(['Mata Pelajaran','Benar','Total Soal','Nilai','Tanggal'],results.map(r=>[esc(r.mapel),r.benar,r.total,r.nilai,dateText(r.tanggal)]))}</div>`}
async function startExam(id){const token=prompt('Masukkan token ujian jika diberikan sekolah (kosongkan jika tidak ada):')||'';try{state.exam=await call('apiStartExam',state.token,id,token);state.questionIndex=0;show('examView');renderQuestion();startTimer()}catch(e){toast(e.message)}}
function startTimer(){clearInterval(state.timer);const ex=state.exam;const end=ex.started+ex.duration*60000;function tick(){state.remaining=Math.max(0,Math.ceil((end-Date.now())/1000));$('timer').textContent=String(Math.floor(state.remaining/60)).padStart(2,'0')+':'+String(state.remaining%60).padStart(2,'0');if(state.remaining<=0){clearInterval(state.timer);submitExam(true)}}tick();state.timer=setInterval(tick,1000)}
function renderQuestion(){const ex=state.exam,q=ex.questions[state.questionIndex];if(!q)return;$('examSubject').textContent='Ujian berlangsung · '+ex.questions.length+' soal';$('questionCount').textContent=`Soal ${q.no} dari ${ex.questions.length}`;$('questionText').textContent=q.pertanyaan;$('questionImage').classList.toggle('hidden',!q.gambar);if(q.gambar)$('questionImage').src=q.gambar;$('saveState').textContent='Jawaban tersimpan';$('options').innerHTML=q.opsi.map(o=>`<div class="option ${q.jawaban===o.id?'selected':''}" data-option="${o.id}"><span class="option-key">${esc(o.kode)}</span><span>${esc(o.teks)}</span></div>`).join('');$('options').onclick=e=>{const opt=e.target.closest('[data-option]');if(opt)chooseOption(opt.dataset.option)};$('markBtn').textContent=q.ragu?'★ Hapus tanda ragu-ragu':'☆ Tandai ragu-ragu';$('prevBtn').disabled=state.questionIndex===0;$('nextBtn').textContent=state.questionIndex===ex.questions.length-1?'Kembali ke awal':'Berikutnya';$('numberGrid').innerHTML=ex.questions.map((x,i)=>`<button class="number-btn ${x.jawaban?'answered':''} ${x.ragu?'marked':''} ${i===state.questionIndex?'current':''}" data-index="${i}">${i+1}</button>`).join('');$('numberGrid').onclick=e=>{const b=e.target.closest('[data-index]');if(b){state.questionIndex=Number(b.dataset.index);renderQuestion()}}}
async function saveCurrent(){const q=state.exam.questions[state.questionIndex];$('saveState').textContent='Menyimpan...';try{await call('apiSaveAnswer',state.token,state.exam.sessionId,state.exam.accessToken,q.id,q.jawaban,q.ragu);$('saveState').textContent='Jawaban tersimpan'}catch(e){$('saveState').textContent='Gagal menyimpan';toast(e.message)}}
function chooseOption(id){const q=state.exam.questions[state.questionIndex];q.jawaban=id;renderQuestion();saveCurrent()}
$('markBtn').onclick=()=>{const q=state.exam.questions[state.questionIndex];q.ragu=!q.ragu;renderQuestion();saveCurrent()};
$('prevBtn').onclick=()=>{if(state.questionIndex>0){state.questionIndex--;renderQuestion()}};
$('nextBtn').onclick=()=>{state.questionIndex=(state.questionIndex+1)%state.exam.questions.length;renderQuestion()};
$('submitExam').onclick=()=>submitExam(false);
async function submitExam(auto){if(!state.exam)return;if(!auto&&!confirm('Yakin ingin menyelesaikan ujian? Jawaban tidak dapat diubah setelah dikirim.'))return;clearInterval(state.timer);try{const r=await call('apiSubmitExam',state.token,state.exam.sessionId,state.exam.accessToken);state.exam=null;show('studentView');if(r.tampilkan){$('studentContent').innerHTML=`<div class="panel result-box"><span class="pill">UJIAN SELESAI</span><h2>Hasil ujian</h2><div class="result-score">${r.nilai}</div><p>Benar: ${r.benar} · Salah: ${r.salah} · Kosong: ${r.kosong}</p><button class="btn primary" onclick="loadStudent()">Kembali ke dashboard</button></div>`}else{toast('Ujian berhasil dikirim. Nilai disimpan oleh sekolah.');await loadStudent()}}catch(e){toast(e.message)}}
</script>
